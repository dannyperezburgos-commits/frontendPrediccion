<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recomendación de Cultivo (SVM / RandomForest)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <main class="max-w-3xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-bold">Formulario — Recomendación de Cultivo</h1>
      <p class="text-sm text-slate-600">
        Envía datos que coincidan con <code>CropRequest</code> y elige el modelo a usar (<em>svm</em> o <em>rf</em>).
      </p>
    </header>

    <section class="bg-white rounded-2xl shadow p-6 space-y-6">
      <!-- Acciones -->
      <div class="flex flex-wrap items-center gap-3">
        <button id="btnEjemplo" type="button"
          class="px-4 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 active:scale-[.99]">
          Autocompletar ejemplo
        </button>
        <button id="btnLimpiar" type="button"
          class="px-4 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 active:scale-[.99]">
          Limpiar
        </button>

        <label class="inline-flex items-center gap-2 ml-auto text-sm">
          <input id="toggleToasts" type="checkbox" class="rounded border-slate-300">
          Usar Toasts (notificaciones)
        </label>
      </div>

      <!-- Formulario -->
      <form id="formCultivo" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Modelo -->
        <div class="flex flex-col md:col-span-2">
          <label for="modelo" class="text-sm font-medium">Modelo</label>
          <select id="modelo" name="modelo" required
            class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500">
            <option value="svm">SVM</option>
            <option value="rf">Random Forest</option>
          </select>
        </div>

        <!-- n, p, k -->
        <div class="flex flex-col">
          <label for="n" class="text-sm font-medium">N (ppm) — entero</label>
          <input id="n" name="n" type="number" step="1" min="0" required
            class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>
        <div class="flex flex-col">
          <label for="p" class="text-sm font-medium">P (ppm) — entero</label>
          <input id="p" name="p" type="number" step="1" min="0" required
            class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>
        <div class="flex flex-col">
          <label for="k" class="text-sm font-medium">K (ppm) — entero</label>
          <input id="k" name="k" type="number" step="1" min="0" required
            class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- temperature, humidity -->
        <div class="flex flex-col">
          <label for="temperature" class="text-sm font-medium">Temperatura (°C) — decimal</label>
          <input id="temperature" name="temperature" type="number" step="any" required
            class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>
        <div class="flex flex-col">
          <label for="humidity" class="text-sm font-medium">Humedad (%) — 0 a 100</label>
          <input id="humidity" name="humidity" type="number" step="any" min="0" max="100" required
            class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- ph, rainfall -->
        <div class="flex flex-col">
          <label for="ph" class="text-sm font-medium">pH — 0 a 14</label>
          <input id="ph" name="ph" type="number" step="any" min="0" max="14" required
            class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>
        <div class="flex flex-col">
          <label for="rainfall" class="text-sm font-medium">Lluvia (mm) — decimal</label>
          <input id="rainfall" name="rainfall" type="number" step="any" min="0" required
            class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- Submit -->
        <div class="md:col-span-2">
          <button id="btnEnviar" type="submit"
            class="w-full md:w-auto px-6 py-3 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700 active:scale-[.99]">
            Enviar y predecir
          </button>
        </div>
      </form>
    </section>
  </main>

  <script>
    /** @typedef {Object} CropRequest
     *  @property {'svm'|'rf'} modelo            - Modelo de predicción a usar
     *  @property {number} n                     - Nitrógeno (ppm) entero
     *  @property {number} p                     - Fósforo (ppm) entero
     *  @property {number} k                     - Potasio (ppm) entero
     *  @property {number} temperature           - Temperatura en °C (decimal)
     *  @property {number} humidity              - Humedad relativa % (0-100)
     *  @property {number} ph                    - pH del suelo (0-14)
     *  @property {number} rainfall              - Lluvia en mm (decimal)
     */

    /** URL del endpoint FastAPI */
    const URL_API = "https://prediccionrepository.onrender.com/predict";

    const form = document.getElementById("formCultivo");
    const btnEjemplo = document.getElementById("btnEjemplo");
    const btnLimpiar = document.getElementById("btnLimpiar");
    const toggleToasts = document.getElementById("toggleToasts");

    // Config base para Toasts SweetAlert2
    const Toast = Swal.mixin({
      toast: true,
      position: "top-end",
      showConfirmButton: false,
      timer: 3500,
      timerProgressBar: true
    });

    /**
     * Construye el payload garantizando los tipos que Pydantic espera.
     * Comentado paso a paso para claridad.
     * @returns {CropRequest}
     */
    function construirPayload() {
      // 1) Tomamos el modelo elegido (string)
      const modelo = document.getElementById("modelo").value;

      // 2) Parseamos enteros
      const n = parseInt(document.getElementById("n").value, 10);
      const p = parseInt(document.getElementById("p").value, 10);
      const k = parseInt(document.getElementById("k").value, 10);

      // 3) Parseamos decimales
      const temperature = parseFloat(document.getElementById("temperature").value);
      const humidity = parseFloat(document.getElementById("humidity").value);
      const ph = parseFloat(document.getElementById("ph").value);
      const rainfall = parseFloat(document.getElementById("rainfall").value);

      // 4) Devolvemos el objeto conforme a CropRequest
      return { modelo, n, p, k, temperature, humidity, ph, rainfall };
    }

    /**
     * Envía datos al backend mostrando alerts modernos:
     * 1. Modal "cargando" mientras hace fetch.
     * 2. Si ok, muestra éxito (modal o toast).
     * 3. Si error, muestra detalle.
     */
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const payload = construirPayload();

      // 1) Mostrar loading
      Swal.fire({
        title: "Enviando...",
        text: "Calculando recomendación",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        const resp = await fetch(URL_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!resp.ok) {
          const errorBody = await resp.json().catch(() => ({}));
          const detalle = JSON.stringify(errorBody, null, 2);
          Swal.close();

          if (toggleToasts.checked) {
            Toast.fire({
              icon: "error",
              title: `Error ${resp.status}`,
              text: "Verifica los datos enviados."
            });
          } else {
            Swal.fire({
              icon: "error",
              title: `Error ${resp.status}`,
              html: `<pre style="text-align:left;white-space:pre-wrap">${detalle}</pre>`
            });
          }
          return;
        }

        const data = await resp.json();
        const texto = `Cultivo recomendado: ${data.prediccion ?? "(sin 'prediccion')"}`;

        Swal.close();

        if (toggleToasts.checked) {
          Toast.fire({ icon: "success", title: texto });
        } else {
          Swal.fire({
            icon: "success",
            title: "¡Recomendación lista!",
            html: `
              <div class="text-left">
                <p class="mb-2"><strong>${texto}</strong></p>
                <details open>
                  <summary><strong>JSON de respuesta</strong></summary>
                  <pre style="white-space:pre-wrap" class="mt-2">${escapeHtml(JSON.stringify(data, null, 2))}</pre>
                </details>
              </div>
            `
          });
        }
      } catch (err) {
        Swal.close();
        const msg = (err && err.message) ? err.message : String(err);
        if (toggleToasts.checked) {
          Toast.fire({ icon: "error", title: "Fallo de red o CORS", text: msg });
        } else {
          Swal.fire({ icon: "error", title: "Fallo de red o CORS", text: msg });
        }
      }
    });

    // Autocompletar datos de ejemplo (valores realistas)
    btnEjemplo.addEventListener("click", () => {
      document.getElementById("modelo").value = "rf";
      document.getElementById("n").value = "90";
      document.getElementById("p").value = "42";
      document.getElementById("k").value = "43";
      document.getElementById("temperature").value = "24.5";
      document.getElementById("humidity").value = "65.0";
      document.getElementById("ph").value = "6.5";
      document.getElementById("rainfall").value = "110.0";
    });

    // Limpiar y feedback visual
    btnLimpiar.addEventListener("click", () => {
      form.reset();
      Toast.fire({ icon: "info", title: "Formulario limpio" });
    });

    /** Escapa HTML para evitar XSS al imprimir JSON dentro de innerHTML. */
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
