<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Predicción de Diabetes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <main class="max-w-4xl mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-2xl font-bold">Formulario — Predicción de Diabetes</h1>
      <p class="text-sm text-slate-600">
        Envía datos que coincidan con <code>PatientData</code> y verás la predicción en un alert moderno.
      </p>
    </header>

    <section class="bg-white rounded-2xl shadow p-6 space-y-6">
      <!-- Acciones -->
      <div class="flex flex-wrap items-center gap-3">
        <button id="btnEjemplo" type="button"
          class="px-4 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 active:scale-[.99]">
          Autocompletar ejemplo
        </button>
        <button id="btnLimpiar" type="button"
          class="px-4 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 active:scale-[.99]">
          Limpiar
        </button>

        <!-- Toggle para usar Toasts en lugar de modal -->
        <label class="inline-flex items-center gap-2 ml-auto text-sm">
          <input id="toggleToasts" type="checkbox" class="rounded border-slate-300">
          Usar Toasts (notificaciones)
        </label>
      </div>

      <!-- Formulario -->
      <form id="formPaciente" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- first_name (str) -->
        <div class="flex flex-col">
          <label for="first_name" class="text-sm font-medium">Nombre</label>
          <input id="first_name" name="first_name" type="text" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- last_name (str) -->
        <div class="flex flex-col">
          <label for="last_name" class="text-sm font-medium">Apellido</label>
          <input id="last_name" name="last_name" type="text" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- identificacion_number (int) -->
        <div class="flex flex-col">
          <label for="identificacion_number" class="text-sm font-medium">Identificación (entero)</label>
          <input id="identificacion_number" name="identificacion_number" type="number" step="1" min="0" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- pregnancies (int) -->
        <div class="flex flex-col">
          <label for="pregnancies" class="text-sm font-medium">Embarazos (entero)</label>
          <input id="pregnancies" name="pregnancies" type="number" step="1" min="0" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- glucose (int) -->
        <div class="flex flex-col">
          <label for="glucose" class="text-sm font-medium">Glucosa (entero)</label>
          <input id="glucose" name="glucose" type="number" step="1" min="0" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- bloodpressure (int) -->
        <div class="flex flex-col">
          <label for="bloodpressure" class="text-sm font-medium">Presión sanguínea (entero)</label>
          <input id="bloodpressure" name="bloodpressure" type="number" step="1" min="0" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- skinthickness (int) -->
        <div class="flex flex-col">
          <label for="skinthickness" class="text-sm font-medium">Grosor de piel (entero)</label>
          <input id="skinthickness" name="skinthickness" type="number" step="1" min="0" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- insulin (int) -->
        <div class="flex flex-col">
          <label for="insulin" class="text-sm font-medium">Insulina (entero)</label>
          <input id="insulin" name="insulin" type="number" step="1" min="0" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- bmi (float) -->
        <div class="flex flex-col">
          <label for="bmi" class="text-sm font-medium">IMC / BMI (decimal)</label>
          <input id="bmi" name="bmi" type="number" step="any" min="0" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- diabetespedigreefunction (float) -->
        <div class="flex flex-col">
          <label for="diabetespedigreefunction" class="text-sm font-medium">Índice hereditario (decimal)</label>
          <input id="diabetespedigreefunction" name="diabetespedigreefunction" type="number" step="any" min="0" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- age (int) -->
        <div class="flex flex-col">
          <label for="age" class="text-sm font-medium">Edad (entero)</label>
          <input id="age" name="age" type="number" step="1" min="0" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- outcome (int) -->
        <div class="flex flex-col">
          <label for="outcome" class="text-sm font-medium">Outcome (0 o 1, entero)</label>
          <input id="outcome" name="outcome" type="number" step="1" min="0" max="1" required
                 class="mt-1 rounded-xl border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" />
        </div>

        <!-- Submit -->
        <div class="md:col-span-2">
          <button id="btnEnviar" type="submit"
                  class="w-full md:w-auto px-6 py-3 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700 active:scale-[.99]">
            Enviar y predecir
          </button>
        </div>
      </form>
    </section>
  </main>

  <script>
    /** @typedef {Object} PatientData
     *  @property {string} first_name
     *  @property {string} last_name
     *  @property {number} identificacion_number
     *  @property {number} pregnancies
     *  @property {number} glucose
     *  @property {number} bloodpressure
     *  @property {number} skinthickness
     *  @property {number} insulin
     *  @property {number} bmi
     *  @property {number} diabetespedigreefunction
     *  @property {number} age
     *  @property {number} outcome
     */

    /** URL del endpoint FastAPI */
    const URL_API = "https://prediccionrepository.onrender.com/predict";

    const form = document.getElementById("formPaciente");
    const btnEjemplo = document.getElementById("btnEjemplo");
    const btnLimpiar = document.getElementById("btnLimpiar");
    const toggleToasts = document.getElementById("toggleToasts");

    // Config base para Toasts SweetAlert2
    const Toast = Swal.mixin({
      toast: true,
      position: "top-end",
      showConfirmButton: false,
      timer: 3500,
      timerProgressBar: true
    });

    /** Construye el payload con los tipos exactos que espera Pydantic. */
    function construirPayload() {
      // Strings
      const first_name = document.getElementById("first_name").value.trim();
      const last_name = document.getElementById("last_name").value.trim();
      // Enteros
      const identificacion_number = parseInt(document.getElementById("identificacion_number").value, 10);
      const pregnancies = parseInt(document.getElementById("pregnancies").value, 10);
      const glucose = parseInt(document.getElementById("glucose").value, 10);
      const bloodpressure = parseInt(document.getElementById("bloodpressure").value, 10);
      const skinthickness = parseInt(document.getElementById("skinthickness").value, 10);
      const insulin = parseInt(document.getElementById("insulin").value, 10);
      const age = parseInt(document.getElementById("age").value, 10);
      const outcome = parseInt(document.getElementById("outcome").value, 10);
      // Flotantes
      const bmi = parseFloat(document.getElementById("bmi").value);
      const diabetespedigreefunction = parseFloat(document.getElementById("diabetespedigreefunction").value);

      return {
        first_name,
        last_name,
        identificacion_number,
        pregnancies,
        glucose,
        bloodpressure,
        skinthickness,
        insulin,
        bmi,
        diabetespedigreefunction,
        age,
        outcome
      };
    }

    /**
     * Envía datos al backend mostrando alerts modernos:
     * 1. Muestra "cargando" (modal) mientras se hace fetch.
     * 2. Si ok, muestra éxito (modal o toast según toggle).
     * 3. Si error, muestra error con detalle (modal o toast).
     */
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const payload = construirPayload();

      // 1) Mostrar loading (solo modal; para Toast no aplica bien el spinner)
      Swal.fire({
        title: "Enviando...",
        text: "Calculando predicción",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        const resp = await fetch(URL_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // 2) Manejo de error HTTP: mostrar detalle del 422 u otros
        if (!resp.ok) {
          const errorBody = await resp.json().catch(() => ({}));
          const detalle = JSON.stringify(errorBody, null, 2);
          Swal.close();

          if (toggleToasts.checked) {
            Toast.fire({
              icon: "error",
              title: `Error ${resp.status}`,
              text: "Verifica los datos enviados."
            });
          } else {
            Swal.fire({
              icon: "error",
              title: `Error ${resp.status}`,
              html: `<pre style="text-align:left;white-space:pre-wrap">${detalle}</pre>`
            });
          }
          return;
        }

        // 3) Respuesta OK: { prediccion: "Sano" | "Enfermo" }
        const data = await resp.json();
        const texto = `Predicción: ${data.prediccion ?? "(sin campo 'prediccion')"}`;

        Swal.close();

        if (toggleToasts.checked) {
          // Toast de éxito
          Toast.fire({
            icon: "success",
            title: texto
          });
        } else {
          // Modal de éxito con JSON detallado
          Swal.fire({
            icon: "success",
            title: "¡Predicción lista!",
            html: `
              <div class="text-left">
                <p class="mb-2"><strong>${texto}</strong></p>
                <details open>
                  <summary><strong>JSON de respuesta</strong></summary>
                  <pre style="white-space:pre-wrap" class="mt-2">${escapeHtml(JSON.stringify(data, null, 2))}</pre>
                </details>
              </div>
            `
          });
        }

      } catch (err) {
        // 4) Error de red/CORS/servidor caído
        Swal.close();
        const msg = (err && err.message) ? err.message : String(err);
        if (toggleToasts.checked) {
          Toast.fire({
            icon: "error",
            title: "Fallo de red o CORS",
            text: msg
          });
        } else {
          Swal.fire({
            icon: "error",
            title: "Fallo de red o CORS",
            text: msg
          });
        }
      }
    });

    // Autocompletar datos de ejemplo
    btnEjemplo.addEventListener("click", () => {
      document.getElementById("first_name").value = "Danny";
      document.getElementById("last_name").value = "perez";
      document.getElementById("identificacion_number").value = "1144157631";
      document.getElementById("pregnancies").value = "1";
      document.getElementById("glucose").value = "87";
      document.getElementById("bloodpressure").value = "51";
      document.getElementById("skinthickness").value = "25";
      document.getElementById("insulin").value = "210";
      document.getElementById("bmi").value = "27.5";
      document.getElementById("diabetespedigreefunction").value = "0.520";
      document.getElementById("age").value = "33";
      document.getElementById("outcome").value = "1";
    });

    // Limpiar y feedback visual
    btnLimpiar.addEventListener("click", () => {
      form.reset();
      Toast.fire({ icon: "info", title: "Formulario limpio" });
    });

    /** Escapa HTML para evitar XSS al imprimir JSON dentro de innerHTML. */
    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
